name: Validate FundiConnect Pro
on:
  push:
    branches: [main, fundiconnect-pro-mvp]
    paths:
      - 'fundiconnect-pro/**'
      - '.github/workflows/fundiconnect-pro-ci.yml'
  pull_request:
    branches: [main, fundiconnect-pro-mvp]
    paths:
      - 'fundiconnect-pro/**'
      - '.github/workflows/fundiconnect-pro-ci.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fundiconnect-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fundiconnect-pro/package-lock.json
      - run: npm ci
      - run: npm test
